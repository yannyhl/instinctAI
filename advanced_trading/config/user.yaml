# Instinct AI Trading System - Default Configuration
# This file contains default configuration values. Do not modify this file directly.
# Create a user.yaml file for your personal settings.

# System-wide settings
system:
  name: "Instinct AI"
  version: "1.0.0"
  environment: "development"  # development, testing, production
  log_level: "INFO"
  
  # Directories
  directories:
    data: "data"
    logs: "logs"
    results: "results"
    models: "models"

# Observability settings
observability:
  metrics:
    enabled: true
    prometheus: false
    storage_duration_days: 7
  
  logging:
    console: true
    file: true
    structured: true
    max_file_size_mb: 10
    max_files: 5
  
  tracing:
    enabled: true
    sampling_rate: 0.1  # 10% of requests
    max_traces: 1000

# Data management
data:
  cache_enabled: true
  cache_duration_minutes: 60
  update_interval_seconds: 60
  max_history_days: 180
  sources:
    - name: "binance"
      enabled: true
      rate_limit: 20  # requests per second
    - name: "coinbase"
      enabled: true
      rate_limit: 15
    - name: "kraken" 
      enabled: true
      rate_limit: 10

# Risk management
risk:
  max_position_size_usd: 10000
  max_portfolio_risk: 0.05  # 5% of account
  max_drawdown_pct: 0.15  # 15% drawdown triggers risk reduction
  max_leverage: 1.0
  volatility_targeting: true
  target_volatility: 0.15  # 15% annualized
  correlation_aware: true

# Exchange settings
exchanges:
  routing:
    default_criterion: "smart"  # smart, lowest_fees, fastest_execution, best_price
    require_price_data: true
    weight:
      latency: 0.3
      fees: 0.3 
      reliability: 0.2
      price: 0.2
  
  profiling:
    update_interval_seconds: 300
    track_latency: true
    track_reliability: true
    track_fees: true

# Strategy settings
strategies:
  max_active_strategies: 10
  execution_concurrency: 4
  correlation_threshold: 0.7  # Correlation threshold for related strategies
  
  # Default parameters by strategy type
  defaults:
    statistical_arbitrage:
      lookback_window: 60
      entry_threshold: 2.0
      exit_threshold: 0.5
      max_position_size: 0.1  # 10% of max position size
    
    funding_rate:
      min_funding_rate: 0.01  # 1% minimum funding rate
      min_rate_difference: 0.005  # 0.5% minimum rate difference
      max_position_size: 0.2  # 20% of max position size
    
    market_microstructure:
      lookback_window: 30
      signal_threshold: 0.65
      max_position_size: 0.15  # 15% of max position size

# Dashboard settings
dashboard:
  port: 8050
  refresh_interval_seconds: 5
  theme: "dark"
  authentication:
    enabled: true
    session_duration_hours: 24
  
  # Component settings
  components:
    portfolio_view:
      enabled: true
      charts:
        - "equity_curve"
        - "drawdown"
        - "strategy_performance"
    
    market_view:
      enabled: true
      max_symbols: 10
      charts:
        - "price"
        - "volume"
        - "order_book"
    
    system_health:
      enabled: true
      metrics:
        - "cpu_usage"
        - "memory_usage"
        - "api_latency"

# Execution settings
execution:
  transaction_cost_model: "dynamic"  # dynamic, fixed, none
  slippage_model: "dynamic"  # dynamic, fixed, none
  order_types:
    - "market"
    - "limit"
    - "stop"
    - "trailing_stop"
  
  # Default settings by order type
  defaults:
    market:
      slippage_pct: 0.001  # 0.1% slippage
    
    limit:
      price_improvement_ticks: 1
      time_in_force: "GTC"  # GTC, IOC, FOK
    
    stop:
      trigger_percent: 0.01  # 1% from entry
      time_in_force: "GTC"

# Backtesting settings
backtesting:
  default_initial_capital: 100000
  include_fees: true
  include_slippage: true
  parallel_execution: true
  max_workers: 8
  
  # Monte Carlo settings
  monte_carlo:
    runs: 1000
    confidence_level: 0.95
    seed: 42
  
  # Walk-forward settings
  walk_forward:
    train_window_days: 60
    test_window_days: 30
    step_size_days: 15
    optimization_metric: "sharpe_ratio"  # sharpe_ratio, total_return, sortino_ratio 