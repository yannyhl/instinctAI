version: '3.8'

services:
  instinct-ai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8050:8050"
    volumes:
      - ./advanced_trading/data:/app/advanced_trading/data
      - ./advanced_trading/logs:/app/advanced_trading/logs
    environment:
      - DASH_DEBUG=false
      - DASH_SECRET_KEY=change_this_to_a_secure_secret_key
      # Add exchange API keys as needed
      # - BINANCE_API_KEY=your_api_key
      # - BINANCE_SECRET_KEY=your_api_secret
    restart: unless-stopped
    command: ["python", "advanced_trading/run_secured_dashboard.py", "--host=0.0.0.0", "--port=8050", "--log-level=INFO"]
    
  # Optional Redis cache service for improved performance
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data: 